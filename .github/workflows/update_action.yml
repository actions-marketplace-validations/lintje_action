name: Update Lintje action

on:
  workflow_dispatch:
    inputs:
      version:
        description: Lintje release version to use, with or without the leading v
        required: true
        type: string

permissions:
  contents: write

env:
  SOURCE_REPO: lintje/lintje
  PUBLISH_GIT_USERNAME: "Lintje release bot"
  PUBLISH_GIT_EMAIL: "lintje@tomdebruijn.com"

jobs:
  update_action:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout action repository
        uses: actions/checkout@v7
        with:
          ssh-key: "${{secrets.PUBLISH_DEPLOY_KEY}}"
          ref: ${{ github.ref_name }}

      - name: Normalize version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Download checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "$SOURCE_REPO" \
            --pattern checksums_256.txt \
            --dir /tmp/lintje-release

      - name: Update action files
        run: |
          ruby script/update_action \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.minor }}" \
            /tmp/lintje-release/checksums_256.txt

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Build package
        run: |
          npm ci
          npm run build

      - name: "Configure Git"
        run: |
          export PUBLISH_GIT_SSH_PATH="$HOME/.ssh"
          export PUBLISH_GIT_SIGN_KEY_PATH="$HOME/.ssh/sign_key"
          mkdir -p "$PUBLISH_GIT_SSH_PATH"
          echo "${{secrets.PUBLISH_GIT_SIGN_KEY}}" > "$PUBLISH_GIT_SIGN_KEY_PATH"
          echo "${{secrets.PUBLISH_GIT_SIGN_PUBLIC_KEY}}" > "$PUBLISH_GIT_SIGN_KEY_PATH.pub"
          chmod 600 "$PUBLISH_GIT_SIGN_KEY_PATH"
          git config --global user.name "$PUBLISH_GIT_USERNAME (as ${{github.actor}})"
          git config --global user.email "$PUBLISH_GIT_EMAIL"
          git config --global gpg.format ssh
          git config --global commit.gpgsign true
          touch ~/.ssh/allowed_signers
          echo "$(git config --get user.email) namespaces=\"git\" $(cat $PUBLISH_GIT_SIGN_KEY_PATH.pub)" >> ~/.ssh/allowed_signers
          git config --global user.signingkey "$PUBLISH_GIT_SIGN_KEY_PATH"

      - name: Commit and push changes
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update to Lintje ${{ steps.version.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: steps.commit.outputs.changed == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git tag -f "v${{ steps.version.outputs.minor }}"
          git push origin "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.minor }}" --force

      - name: Create GitHub release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Update to Lintje ${{ steps.version.outputs.version }}."

      - name: "Add next steps to the workflow summary"
        if: steps.commit.outputs.changed == 'true'
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.version }}"

          {
            echo "## Next step: publish the Action to the GitHub Marketplace"
            echo ""
            echo "Publish the v${RELEASE_VERSION} release to the GitHub Marketplace " \
              "by editing the release and selecting \"Publish this Action to the " \
              "GitHub Marketplace\". Publishing requires two-factor authentication."
            echo ""
            echo "https://github.com/lintje/action/releases/v${RELEASE_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
